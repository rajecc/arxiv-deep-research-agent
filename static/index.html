<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArXiv Deep-Research Agent</title>
  <meta name="description" content="Autonomous Multi-Agent LLM System for Deep Technical Research & Comparative Analysis of AI Papers" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Marked.js (Markdown rendering) -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void:    '#030712',
            cosmos:  '#070A13',
            surface: '#0F172A',
            panel:   '#111827',
            blue: {
              apple:  '#007AFF',
              glow:   '#3A86FF',
              dim:    '#1D4ED8',
            },
          },
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', '"Helvetica Neue"', 'Arial', 'sans-serif'],
            mono: ['"SF Mono"', '"Fira Code"', '"Cascadia Code"', 'Menlo', 'monospace'],
          },
          backdropBlur: { apple: '20px' },
          animation: {
            'spin-slow': 'spin 2s linear infinite',
            'pulse-dim': 'pulse 3s ease-in-out infinite',
            'fade-up': 'fadeUp .35s ease both',
          },
          keyframes: {
            fadeUp: {
              '0%':   { opacity: '0', transform: 'translateY(14px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            },
          },
        },
      },
    }
  </script>

  <style>
    /* Scrollbar */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(58,134,255,.3); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(58,134,255,.6); }

    /* Glass card */
    .glass {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(20px) saturate(1.5);
      -webkit-backdrop-filter: blur(20px) saturate(1.5);
      border: 1px solid rgba(255,255,255,0.06);
    }

    /* Glow ring animation */
    .glow-ring {
      box-shadow: 0 0 0 2px rgba(58,134,255,0.5), 0 0 20px rgba(58,134,255,0.3);
    }

    /* Report markdown styles */
    .report-md h1 { font-size:1.4rem; font-weight:600; color:#F0F4FF; margin:1.4rem 0 .7rem; }
    .report-md h2 { font-size:1.15rem; font-weight:600; color:#CBD5E1; margin:1.2rem 0 .5rem; }
    .report-md h3 { font-size:1rem; font-weight:500; color:#94A3B8; margin:1rem 0 .4rem; }
    .report-md p  { color:#8EA8D5; line-height:1.75; margin:.5rem 0; }
    .report-md table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.82rem; }
    .report-md th { background:rgba(58,134,255,.1); color:#94A3B8; font-weight:600; text-transform:uppercase; font-size:.7rem; letter-spacing:.5px; padding:8px 14px; text-align:left; border-bottom:1px solid rgba(58,134,255,.15); }
    .report-md td { padding:8px 14px; color:#8EA8D5; border-bottom:1px solid rgba(255,255,255,.03); }
    .report-md tr:hover td { background:rgba(58,134,255,.04); }
    .report-md code { font-family:monospace; font-size:.8rem; background:rgba(255,255,255,.07); padding:2px 6px; border-radius:4px; color:#3A86FF; }
    .report-md pre { background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.06); border-radius:10px; padding:16px; overflow-x:auto; margin:.8rem 0; }
    .report-md pre code { background:none; color:#94A3B8; }
    .report-md ul, .report-md ol { padding-left:1.4rem; color:#8EA8D5; line-height:1.75; }
    .report-md li { margin:.25rem 0; }
    .report-md blockquote { border-left:3px solid #3A86FF; padding-left:1rem; color:#94A3B8; margin:.8rem 0; }
    .report-md hr { border:none; border-top:1px solid rgba(255,255,255,.06); margin:1.5rem 0; }

    /* Glow button */
    .btn-primary {
      background: linear-gradient(135deg, #3A86FF, #007AFF);
      box-shadow: 0 0 20px rgba(58,134,255,.4);
    }
    .btn-primary:hover { box-shadow: 0 0 32px rgba(58,134,255,.65); }
    .btn-primary:disabled { opacity:.45; cursor:not-allowed; box-shadow:none; }

    /* Step timeline */
    .step-enter { animation: fadeUp .3s ease both; }

    /* Neon accent line */
    .neon-line {
      background: linear-gradient(90deg, transparent, rgba(58,134,255,.6), transparent);
      height: 1px;
    }
  </style>
</head>

<body class="h-full bg-void text-slate-100 font-sans antialiased"
  x-data="agent()"
  x-init="init()">

  <!-- ─── Background orbs ─────────────────────────────────── -->
  <div class="fixed inset-0 overflow-hidden pointer-events-none" aria-hidden="true">
    <div class="absolute top-[-20%] left-[10%] w-[600px] h-[600px] rounded-full opacity-[0.06]"
         style="background:radial-gradient(circle, #3A86FF 0%, transparent 70%); filter:blur(80px)"></div>
    <div class="absolute bottom-[-10%] right-[5%] w-[500px] h-[500px] rounded-full opacity-[0.04]"
         style="background:radial-gradient(circle, #007AFF 0%, transparent 70%); filter:blur(80px)"></div>
  </div>

  <!-- ─── Main layout ──────────────────────────────────────── -->
  <div class="relative min-h-screen flex flex-col max-w-[1400px] mx-auto px-6 py-10 gap-10">

    <!-- ── Header ──────────────────────────────────────────── -->
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-4">
        <div class="w-10 h-10 rounded-[10px] flex items-center justify-center text-white font-bold text-lg shrink-0"
             style="background:linear-gradient(135deg,#3A86FF,#007AFF); box-shadow:0 0 20px rgba(58,134,255,.5)">
          ⚗
        </div>
        <div>
          <h1 class="text-xl font-light tracking-tight text-slate-50 leading-tight">ArXiv Deep-Research Agent</h1>
          <p class="text-xs text-slate-500 mt-0.5 font-medium tracking-wide uppercase">Autonomous Multi-Agent LLM Pipeline</p>
        </div>
      </div>
      <!-- Status pill -->
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full text-xs font-medium"
           :class="isLoading
             ? 'bg-blue-glow/10 border border-blue-glow/30 text-blue-glow'
             : done
               ? 'bg-green-500/10 border border-green-500/30 text-green-400'
               : 'bg-slate-800/60 border border-white/5 text-slate-500'">
        <span class="w-1.5 h-1.5 rounded-full"
              :class="isLoading ? 'bg-blue-glow animate-pulse' : done ? 'bg-green-400' : 'bg-slate-600'"></span>
        <span x-text="isLoading ? 'Running' : done ? 'Complete' : 'Ready'"></span>
      </div>
    </header>

    <div class="neon-line opacity-40"></div>

    <!-- ── Input Panel ──────────────────────────────────────── -->
    <section class="glass rounded-2xl p-8 animate-fade-up">
      <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500 mb-6">Research Topic</h2>

      <!-- Preset chips -->
      <div class="flex flex-wrap gap-2 mb-5">
        <template x-for="preset in presets" :key="preset">
          <button @click="query = preset"
                  class="px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-200 border"
                  :class="query === preset
                    ? 'bg-blue-glow/15 border-blue-glow/40 text-blue-glow'
                    : 'bg-white/[0.03] border-white/[0.07] text-slate-400 hover:border-blue-glow/25 hover:text-slate-300'"
                  x-text="preset">
          </button>
        </template>
      </div>

      <!-- Query input -->
      <div class="flex gap-3">
        <input
          x-model="query"
          @keydown.enter="!isLoading && startResearch()"
          type="text"
          placeholder="e.g. Speculative Decoding in Large Language Models…"
          class="flex-1 bg-white/[0.04] border border-white/[0.08] rounded-xl px-5 py-3.5 text-sm text-slate-200 placeholder-slate-600
                 focus:outline-none focus:border-blue-glow/50 focus:ring-2 focus:ring-blue-glow/15
                 transition-all duration-200"
        />
        <button
          @click="startResearch()"
          :disabled="isLoading || !query.trim()"
          class="btn-primary px-7 py-3.5 rounded-xl text-sm font-semibold text-white
                 transition-all duration-200 active:scale-95 whitespace-nowrap select-none">
          <span x-show="!isLoading">🚀 Start Research</span>
          <span x-show="isLoading" class="flex items-center gap-2">
            <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"/>
            </svg>
            Researching…
          </span>
        </button>
      </div>

      <!-- Config row -->
      <div class="flex flex-wrap items-center gap-6 mt-6 pt-5 border-t border-white/[0.05]">
        <!-- Provider -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-slate-500 font-medium">LLM Provider</label>
          <select x-model="provider"
                  class="bg-white/[0.04] border border-white/[0.08] rounded-lg px-3 py-2 text-xs text-slate-300
                         focus:outline-none focus:border-blue-glow/40 transition-all duration-200">
            <option value="openai_compatible">VseLLM / OpenRouter</option>
            <option value="gemini">Google Gemini</option>
          </select>
        </div>

        <!-- Max Papers -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-slate-500 font-medium">Papers: <span class="text-blue-glow" x-text="maxPapers"></span></label>
          <input type="range" x-model.number="maxPapers" min="1" max="5"
                 class="w-28 accent-blue-glow cursor-pointer" />
        </div>

        <!-- Min Year -->
        <div class="flex flex-col gap-1.5">
          <label class="text-xs text-slate-500 font-medium">From Year: <span class="text-blue-glow" x-text="minYear"></span></label>
          <input type="range" x-model.number="minYear" min="2023" max="2026"
                 class="w-28 accent-blue-glow cursor-pointer" />
        </div>

        <!-- API Key -->
        <div class="flex flex-col gap-1.5 flex-1 min-w-[180px]">
          <label class="text-xs text-slate-500 font-medium">API Key <span class="text-slate-600">(optional override)</span></label>
          <input type="password" x-model="apiKey" placeholder="sk-…"
                 class="bg-white/[0.04] border border-white/[0.08] rounded-lg px-3 py-2 text-xs text-slate-300
                        focus:outline-none focus:border-blue-glow/40 transition-all duration-200" />
        </div>
      </div>
    </section>

    <!-- ── Progress Timeline ────────────────────────────────── -->
    <section x-show="steps.length > 0 || isLoading" x-cloak class="glass rounded-2xl p-8 animate-fade-up">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-sm font-semibold uppercase tracking-widest text-slate-500">Pipeline Progress</h2>
        <span x-show="done" class="flex items-center gap-1.5 text-xs font-medium text-green-400">
          <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
          Completed in <span x-text="elapsedSec"></span>s
        </span>
      </div>

      <!-- Step list -->
      <div class="space-y-2.5 max-h-56 overflow-y-auto pr-1">
        <template x-for="(step, i) in steps" :key="i">
          <div class="step-enter flex items-start gap-3">
            <div class="w-5 h-5 rounded-full bg-green-500/15 border border-green-500/35 flex items-center justify-center shrink-0 mt-0.5">
              <svg class="w-3 h-3 text-green-400" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
            </div>
            <div>
              <span class="text-xs font-semibold text-slate-400" x-text="'Step ' + step.step + ' · ' + step.node.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase())"></span>
              <p class="text-xs text-slate-500 mt-0.5 leading-relaxed" x-text="step.message"></p>
            </div>
          </div>
        </template>

        <!-- Loading step -->
        <div x-show="isLoading" class="step-enter flex items-center gap-3">
          <div class="w-5 h-5 rounded-full bg-blue-glow/15 border border-blue-glow/40 flex items-center justify-center shrink-0">
            <svg class="w-3 h-3 text-blue-glow animate-spin" fill="none" viewBox="0 0 24 24">
              <path fill="currentColor" d="M12 4a8 8 0 018 8h-2a6 6 0 00-6-6V4z"/>
            </svg>
          </div>
          <span class="text-xs text-blue-glow font-medium">Processing…</span>
        </div>
      </div>

      <!-- Stats bar -->
      <div x-show="done" class="flex flex-wrap gap-3 mt-6 pt-5 border-t border-white/[0.05]">
        <template x-for="stat in stats" :key="stat.label">
          <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-white/[0.04] border border-white/[0.06] text-xs">
            <span class="text-slate-500" x-text="stat.label"></span>
            <span class="text-slate-200 font-semibold" x-text="stat.value"></span>
          </div>
        </template>
      </div>
    </section>

    <!-- ── Results Tabs ─────────────────────────────────────── -->
    <section x-show="done" x-cloak class="animate-fade-up">

      <!-- Tab bar -->
      <div class="flex gap-1 p-1 rounded-xl bg-white/[0.03] border border-white/[0.05] mb-6 w-fit">
        <template x-for="tab in tabs" :key="tab.id">
          <button @click="activeTab = tab.id"
                  class="px-5 py-2 rounded-lg text-sm font-medium transition-all duration-200"
                  :class="activeTab === tab.id
                    ? 'bg-blue-glow/15 text-blue-glow border border-blue-glow/25'
                    : 'text-slate-500 hover:text-slate-300'">
            <span x-text="tab.label"></span>
          </button>
        </template>
      </div>

      <!-- ── Tab: Report ──────────────────────────────────── -->
      <div x-show="activeTab === 'report'">
        <div class="glass rounded-2xl overflow-hidden">
          <!-- Toolbar -->
          <div class="flex items-center justify-between px-6 py-4 border-b border-white/[0.05]">
            <div class="flex items-center gap-2">
              <span x-show="factCheckPassed"
                    class="flex items-center gap-1.5 text-xs font-medium text-green-400 bg-green-500/10 border border-green-500/25 px-3 py-1 rounded-full">
                <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"/></svg>
                Fact-Checked
              </span>
              <span class="text-xs text-slate-600 font-mono" x-text="(report.length / 1000).toFixed(1) + 'k chars'"></span>
            </div>
            <button @click="downloadReport()"
                    class="flex items-center gap-2 px-4 py-2 rounded-lg bg-white/[0.04] border border-white/[0.08]
                           text-xs font-medium text-slate-300 hover:border-blue-glow/30 hover:text-blue-glow transition-all duration-200">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
              </svg>
              Download .md
            </button>
          </div>
          <!-- Content -->
          <div class="p-8 max-h-[640px] overflow-y-auto report-md"
               x-html="renderMarkdown(report)"></div>
        </div>
      </div>

      <!-- ── Tab: Papers ──────────────────────────────────── -->
      <div x-show="activeTab === 'papers'">
        <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
          <template x-for="paper in papers" :key="paper.arxiv_id">
            <div class="glass rounded-2xl p-6 flex flex-col gap-4 hover:border-blue-glow/25
                        transition-all duration-300 hover:-translate-y-1 animate-fade-up group cursor-default">
              <!-- Header -->
              <div class="flex items-center justify-between">
                <span class="font-mono text-[11px] text-blue-glow font-medium" x-text="'arXiv:' + paper.arxiv_id"></span>
                <span class="text-[10px] text-slate-600 bg-white/[0.04] border border-white/[0.06] rounded-full px-2 py-0.5"
                      x-text="paper.primary_category"></span>
              </div>
              <!-- Title -->
              <h3 class="text-sm font-semibold text-slate-100 leading-snug line-clamp-2" x-text="paper.title"></h3>
              <!-- Authors -->
              <p class="text-xs text-slate-600 line-clamp-1"
                 x-text="paper.authors.slice(0,3).join(', ') + (paper.authors.length > 3 ? ' et al.' : '')"></p>
              <!-- Abstract -->
              <p class="text-xs text-slate-500 leading-relaxed line-clamp-3" x-text="paper.abstract"></p>
              <!-- Metrics -->
              <div class="flex flex-wrap gap-2 mt-auto pt-3 border-t border-white/[0.05]">
                <span class="text-[11px] bg-white/[0.03] border border-white/[0.06] rounded-full px-2 py-1 text-slate-500">
                  ⭐ <span class="text-slate-400 font-medium" x-text="paper.hf_upvotes"></span>
                </span>
                <span class="text-[11px] bg-white/[0.03] border border-white/[0.06] rounded-full px-2 py-1 text-slate-500">
                  📚 <span class="text-slate-400 font-medium" x-text="paper.citation_count ?? 0"></span>
                </span>
                <span class="text-[11px] bg-white/[0.03] border border-white/[0.06] rounded-full px-2 py-1 text-slate-500"
                      x-text="'📅 ' + (paper.published_date ? paper.published_date.slice(0,7) : 'N/A')">
                </span>
                <a :href="paper.arxiv_url" target="_blank" rel="noopener"
                   class="ml-auto text-[11px] text-blue-glow hover:text-blue-400 transition-colors flex items-center gap-1 font-medium">
                  View
                  <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
                  </svg>
                </a>
              </div>
              <!-- GitHub links -->
              <template x-if="paper.github_urls && paper.github_urls.length > 0">
                <div class="flex flex-wrap gap-1.5">
                  <template x-for="url in paper.github_urls.slice(0,2)" :key="url">
                    <a :href="url" target="_blank" rel="noopener"
                       class="text-[10px] text-slate-600 hover:text-slate-400 transition-colors underline line-clamp-1 max-w-full">
                      <span x-text="url.replace('https://github.com/','github.com/')"></span>
                    </a>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>
      </div>

      <!-- ── Tab: Analyses ────────────────────────────────── -->
      <div x-show="activeTab === 'analyses'" class="space-y-4">
        <template x-for="(analysis, i) in analyses" :key="analysis.arxiv_id">
          <div class="glass rounded-2xl overflow-hidden animate-fade-up transition-all duration-300">
            <!-- Header (toggle) -->
            <button @click="toggleAnalysis(i)"
                    class="w-full flex items-center gap-4 px-6 py-5 text-left hover:bg-white/[0.02] transition-colors duration-200">
              <span class="font-mono text-xs text-blue-glow shrink-0" x-text="'arXiv:' + analysis.arxiv_id"></span>
              <h3 class="text-sm font-semibold text-slate-200 flex-1 line-clamp-1" x-text="analysis.title"></h3>
              <div class="flex items-center gap-2 shrink-0">
                <span class="text-[11px] text-slate-600" x-text="(analysis.benchmarks?.length ?? 0) + ' benchmarks'"></span>
                <svg class="w-4 h-4 text-slate-600 transition-transform duration-200"
                     :class="openAnalyses.includes(i) ? 'rotate-180' : ''"
                     fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
                </svg>
              </div>
            </button>

            <!-- Body -->
            <div x-show="openAnalyses.includes(i)" x-cloak
                 class="px-6 pb-6 space-y-5 border-t border-white/[0.05]">

              <!-- Core innovation -->
              <div class="pt-5">
                <p class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-2">💡 Core Innovation</p>
                <p class="text-sm text-slate-400 leading-relaxed" x-text="analysis.core_innovation"></p>
              </div>

              <!-- Architecture -->
              <div>
                <p class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-2">🏗 Architecture</p>
                <p class="text-sm text-slate-400 leading-relaxed" x-text="analysis.architecture_details"></p>
              </div>

              <!-- Math formulation -->
              <template x-if="analysis.mathematical_formulation">
                <div>
                  <p class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-2">🧮 Formulation</p>
                  <pre class="bg-black/30 border border-white/[0.06] rounded-xl p-4 text-xs text-slate-400 font-mono overflow-x-auto leading-relaxed whitespace-pre-wrap"
                       x-text="analysis.mathematical_formulation"></pre>
                </div>
              </template>

              <!-- Limitations -->
              <template x-if="analysis.limitations && analysis.limitations.length">
                <div>
                  <p class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-2">⚠️ Limitations</p>
                  <ul class="space-y-1.5 pl-4 list-disc">
                    <template x-for="lim in analysis.limitations" :key="lim">
                      <li class="text-xs text-slate-500 leading-relaxed" x-text="lim"></li>
                    </template>
                  </ul>
                </div>
              </template>

              <!-- Benchmarks table -->
              <template x-if="analysis.benchmarks && analysis.benchmarks.length">
                <div>
                  <p class="text-[10px] font-semibold text-slate-600 uppercase tracking-widest mb-3">📊 Benchmarks (<span x-text="analysis.benchmarks.length"></span>)</p>
                  <div class="overflow-x-auto rounded-xl border border-white/[0.06]">
                    <table class="w-full text-xs">
                      <thead>
                        <tr>

  <!-- ─── Alpine.js App Logic ────────────────────────────── -->
  <script>
    function agent() {
      return {
        // ── State ──────────────────────────────────────────
        query: '',
        provider: 'openai_compatible',
        maxPapers: 2,
        minYear: 2024,
        apiKey: '',

        isLoading: false,
        done: false,
        error: null,

        steps: [],
        papers: [],
        analyses: [],
        report: '',
        factCheckPassed: false,
        stats: [],
        openAnalyses: [],
        activeTab: 'report',

        startTime: 0,
        elapsedSec: 0,
        elapsedInterval: null,

        presets: [
          'Speculative Decoding in Large Language Models',
          'Test-Time Compute Scaling and Reasoning',
          'KV Cache Compression & Context Window Extension',
          'Linear Attention and State Space Models',
          'Mixture of Experts Routing Efficiency',
        ],

        tabs: [
          { id: 'report',   label: '📄 Master Report' },
          { id: 'papers',   label: '📚 Papers' },
          { id: 'analyses', label: '🔬 Analyses' },
        ],

        // ── Init ───────────────────────────────────────────
        init() {
          this.query = this.presets[0]
        },

        // ── Research ───────────────────────────────────────
        async startResearch() {
          if (!this.query.trim() || this.isLoading) return

          // Reset
          this.isLoading = true
          this.done = false
          this.error = null
          this.steps = []
          this.papers = []
          this.analyses = []
          this.report = ''
          this.factCheckPassed = false
          this.stats = []
          this.openAnalyses = []
          this.activeTab = 'report'

          // Timer
          this.startTime = Date.now()
          this.elapsedSec = 0
          clearInterval(this.elapsedInterval)
          this.elapsedInterval = setInterval(() => {
            this.elapsedSec = ((Date.now() - this.startTime) / 1000).toFixed(1)
          }, 100)

          try {
            const resp = await fetch('/api/research/stream', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                query: this.query,
                max_papers: this.maxPapers,
                min_year: this.minYear,
                provider: this.provider,
                api_key: this.apiKey || null,
              }),
            })

            const reader = resp.body.getReader()
            const decoder = new TextDecoder()
            let buffer = ''

            while (true) {
              const { done, value } = await reader.read()
              if (done) break
              buffer += decoder.decode(value, { stream: true })

              const lines = buffer.split('\n')
              buffer = lines.pop() // incomplete line

              let eventType = null
              for (const line of lines) {
                if (line.startsWith('event:')) {
                  eventType = line.replace('event:', '').trim()
                } else if (line.startsWith('data:') && eventType) {
                  const raw = line.replace('data:', '').trim()
                  try {
                    const payload = JSON.parse(raw)
                    this.handleEvent(eventType, payload)
                  } catch {}
                  eventType = null
                }
              }
            }

          } catch (err) {
            this.error = err.message || 'Connection failed'
          } finally {
            this.isLoading = false
            clearInterval(this.elapsedInterval)
          }
        },

        handleEvent(type, payload) {
          switch (type) {
            case 'step':
              this.steps.push(payload)
              break
            case 'papers':
              this.papers = payload
              this.tabs[1].label = `📚 Papers (${payload.length})`
              break
            case 'analyses':
              this.analyses = payload
              this.tabs[2].label = `🔬 Analyses (${payload.length})`
              break
            case 'report':
              this.report = payload.content || ''
              break
            case 'done':
              this.done = true
              this.factCheckPassed = payload.fact_check_passed
              this.stats = [
                { label: 'Papers', value: payload.paper_count },
                { label: 'Analyses', value: payload.analysis_count },
                { label: 'Steps', value: payload.steps },
                { label: 'Fact-Check', value: payload.fact_check_passed ? '✅ Passed' : '⚠️ Notes' },
              ]
              break
            case 'error':
              this.error = payload.message
              break
          }
        },

        // ── Helpers ────────────────────────────────────────
        renderMarkdown(text) {
          try { return marked.parse(text || '') } catch { return `<pre>${text}</pre>` }
        },

        toggleAnalysis(i) {
          const idx = this.openAnalyses.indexOf(i)
          if (idx === -1) this.openAnalyses.push(i)
          else this.openAnalyses.splice(idx, 1)
        },

        downloadReport() {
          if (!this.report) return
          const blob = new Blob([this.report], { type: 'text/markdown' })
          const url = URL.createObjectURL(blob)
          const a = document.createElement('a')
          a.href = url
          a.download = `arxiv_report_${Date.now()}.md`
          a.click()
          URL.revokeObjectURL(url)
        },
      }
    }
  </script>
